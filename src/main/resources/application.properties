spring.application.name=stock_tracker
server.port=${PORT:8080}

spring.main.banner-mode=off
logging.level.root=warn

alpha.vantage.base.url=https://www.alphavantage.co/query
alpha.vantage.api.key=${ALPHA_VANTAGE_API_KEY:demo}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

spring.datasource.url=jdbc:h2:file:./data/stockdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cache.type=simple
spring.web.error.include-message=always
